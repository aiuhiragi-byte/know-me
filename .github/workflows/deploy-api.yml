name: Deploy API (Cloudflare Workers)

on:
  push:
    branches: [main]
    paths: ['server/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ensure D1 database exists and inject its id
        run: |
          npx wrangler@4 d1 create toukei-tori 2>/dev/null || true
          DB_ID=$(npx wrangler@4 d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const db=JSON.parse(s).find(d=>d.name==='toukei-tori');console.log(db.uuid)})")
          sed -i "s/REPLACED_IN_CI/${DB_ID}/" wrangler.toml
      - name: Apply schema
        run: npx wrangler@4 d1 execute toukei-tori --remote --file schema.sql -y
      - name: Deploy worker
        run: npx wrangler@4 deploy
