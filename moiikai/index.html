<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050506">
<title>もういいかい</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Shippori+Mincho:wght@500;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: 全画面の一人称3D（2階建ての迷路）。中央に点、左上に状態HUD、右上にミニマップ、タッチ端末は下部にスティックとボタン。単一のダークな見た目で固定 */
:root{
  --void:#050506;
  --bone:#e8e2d4;
  --bone-dim:#8f897d;
  --blood:#c41e1e;
  --exit:#3cff8a;
  --fuse:#ff9a3c;
  --stam:#d9c27a;
  --panel:rgba(8,8,10,.62);
  --line:rgba(232,226,212,.16);
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:var(--void);color:var(--bone);font-family:var(--f-body)}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at center,transparent 48%,rgba(0,0,0,.72) 100%)}
.grain{position:fixed;inset:-140px;pointer-events:none;z-index:1;opacity:.11;mix-blend-mode:overlay;background-size:128px 128px;will-change:transform}
.glitch{position:fixed;inset:-8px;pointer-events:none;z-index:1;opacity:0;background:repeating-linear-gradient(0deg,rgba(232,226,212,.07) 0 1px,transparent 1px 3px),linear-gradient(90deg,rgba(196,30,30,.10),transparent 30%,transparent 70%,rgba(60,120,255,.08));mix-blend-mode:screen}
.dread{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.92) 100%);opacity:0}
.hurt{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at center,rgba(196,30,30,.12) 20%,rgba(196,30,30,.8) 100%);opacity:0;transition:opacity .7s}
.hurt.on{opacity:1;transition:none}
.hpfx{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:0;transition:opacity 1.2s;background:radial-gradient(ellipse at center,transparent 42%,rgba(150,10,10,.55) 82%,rgba(90,0,0,.9) 100%)}
.hpfx.l1{opacity:.42}
.hpfx.l2{opacity:.85;animation:hpb 1s ease-in-out infinite}
@keyframes hpb{0%,100%{opacity:.6}12%{opacity:1}30%{opacity:.72}42%{opacity:.95}}
.tirefx{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:0;background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,.85) 100%)}
.mapline{font-family:var(--f-display);font-size:13px;letter-spacing:.08em;color:var(--bone)}
.map .pips,.map .mates{justify-content:flex-end}
.map #floor{font-size:13px}
.flashw{position:fixed;inset:0;pointer-events:none;z-index:1;background:var(--bone);opacity:0;transition:opacity .3s}
.flashw.on{opacity:.1;transition:none}
.deathfx{position:fixed;inset:0;pointer-events:none;z-index:8;background:#000;opacity:0;transition:opacity .25s}
.deathfx.on{opacity:1;transition:opacity 1s}
.dot{position:fixed;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:var(--bone);opacity:.75;pointer-events:none;z-index:2;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;pointer-events:none;z-index:2}
.floor{font-family:var(--f-display);font-size:20px;letter-spacing:.06em}
.hp{display:flex;gap:4px}
.hp i{width:22px;height:8px;background:var(--blood);border-radius:1px}
.hp i.off{background:rgba(196,30,30,.2)}
.stam{width:118px;height:5px;background:rgba(217,194,122,.18);border-radius:3px;overflow:hidden}
.stam i{display:block;height:100%;width:100%;background:var(--stam);transform-origin:left center}
.stam.tired i{background:var(--blood)}
.batt{width:118px;height:5px;background:rgba(232,226,212,.14);border-radius:3px;overflow:hidden;position:relative}
.batt i{display:block;height:100%;width:100%;background:#e9e2c9;transform-origin:left center}
.batt.low i{background:#d98a2b}
.batt.dead i{background:var(--blood)}
.batt.dead{animation:bd .5s steps(2) infinite}
@keyframes bd{50%{opacity:.35}}
.clearfx{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity 2.2s ease;z-index:30}
.clearfx.on{opacity:1}
#s-start{background:radial-gradient(ellipse at 50% 38%,rgba(5,5,6,.35) 0%,rgba(5,5,6,.82) 62%,rgba(3,2,3,.96) 100%)}
#s-start .box{gap:12px;max-width:40rem}
.screen h1.ttl{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:800;font-size:clamp(40px,11vw,80px);letter-spacing:.2em;margin:0 0 0 .2em;white-space:nowrap;line-height:1.1;color:var(--bone);text-shadow:0 0 18px rgba(194,26,26,.55),0 0 2px rgba(0,0,0,.9);animation:ttlf 7s linear infinite}
.ttl b{color:var(--blood);font-weight:800}
@keyframes ttlf{0%,91%,94%,100%{opacity:1}92%{opacity:.35}93%{opacity:.85}96%{opacity:.5}}
.ttl-rule{width:min(60%,18rem);height:1px;background:linear-gradient(90deg,transparent,var(--blood),transparent);margin:2px 0 4px}
.screen p.lore{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:500;font-size:clamp(14px,3.6vw,17px);line-height:2;letter-spacing:.1em;color:var(--bone);margin:0 0 6px;text-wrap:balance}
.lore span{display:block;opacity:0;animation:lorein 1.8s ease forwards}
.lore span:nth-child(2){animation-delay:1.3s}.lore span:nth-child(3){animation-delay:2.6s}
@keyframes lorein{to{opacity:.92}}
.go-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(100%,22rem)}
.go-row .go{margin:0;padding-inline:8px;width:100%}
.story{position:fixed;left:0;right:0;top:56%;text-align:center;z-index:4;pointer-events:none;padding-inline:20px;font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:500;font-size:clamp(15px,3.8vw,21px);letter-spacing:.12em;line-height:1.9;color:var(--bone);text-shadow:0 0 10px #000,0 0 3px #000;opacity:0;transition:opacity 1.8s;text-wrap:balance}
.story.on{opacity:1}
.usehint{position:fixed;left:50%;bottom:24%;transform:translateX(-50%);z-index:4;pointer-events:none;padding:6px 14px;border-radius:999px;background:rgba(8,7,9,.72);border:1px solid var(--line);color:var(--bone);font-size:14px;letter-spacing:.06em}
.usehint[hidden]{display:none}
.usehint b{display:inline-block;min-width:1.5em;margin-right:8px;padding:1px 6px;border-radius:4px;background:var(--bone);color:var(--void);font-size:12px;text-align:center}
#b-use{border-color:var(--stam);color:var(--stam)}
#s-clear .lore{color:#1c1a18;margin:4px 0 10px}
#s-clear .lore span{animation-duration:2.2s}
#s-clear .lore span:nth-child(2){animation-delay:2s}#s-clear .lore span:nth-child(3){animation-delay:4s}
@media (max-width:520px){#s-start .chars{grid-template-columns:repeat(6,1fr);gap:5px;width:100%}#s-start .chr span{font-size:8.5px;letter-spacing:-.04em}#s-start .chr span b{font-size:11px}}
@media (prefers-reduced-motion:reduce){.ttl{animation:none}.lore span{animation:none;opacity:.92}}
#s-clear{background:#f4f1ea}
#s-clear .box{background:none;border:none;box-shadow:none}
#s-clear h1{color:#1c1a18;letter-spacing:.3em}
#s-clear .stats{display:grid;grid-template-columns:auto auto;gap:6px 18px;justify-content:center;color:#2a2622;font-size:17px;margin:6px 0 14px}
#s-clear .stats b{font-weight:600;text-align:left}
#s-clear .stats span{text-align:right;opacity:.7}
#s-clear .go{background:#1c1a18;color:#f4f1ea;border-color:#1c1a18}
.meta{font-size:12px;font-weight:700;color:var(--bone-dim);font-variant-numeric:tabular-nums}
.meta.auto{color:var(--bone)}
.meta.auto b{color:var(--stam);font-weight:700}
.pips{display:flex;gap:6px;align-items:center;min-height:14px;font-size:13px;font-weight:700;color:var(--exit);font-variant-numeric:tabular-nums}
.pips i{width:11px;height:11px;border-radius:50%;border:2px solid var(--fuse)}
.pips i.on{background:var(--fuse);box-shadow:0 0 8px var(--fuse)}
.pips b{width:10px;height:10px;border:2px solid #4a8cff;border-radius:2px;margin-left:4px}
.pips b.on{background:#4a8cff;box-shadow:0 0 8px #4a8cff}
.mates{display:flex;gap:6px;min-height:12px}
.mates i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.mates i.cap{background:transparent;border:2px solid #ff2828;animation:dpulse .45s ease-in-out infinite}
.downfx.cap{background:radial-gradient(ellipse at center,rgba(0,0,0,0) 30%,rgba(40,0,0,.88) 100%)}
.downfx.dead{background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(0,0,0,.8) 100%);animation:none}
.capinfo{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 62px);transform:translateX(-50%);z-index:5;display:flex;gap:8px;align-items:center;padding:6px 14px;border-radius:999px;background:rgba(8,7,9,.7);border:1px solid var(--line);color:var(--bone);font-size:13px;letter-spacing:.08em;pointer-events:none}
.capinfo[hidden]{display:none}
.cg{position:fixed;z-index:7;width:172px;height:172px;left:50%;bottom:13%;transform:translateX(-50%);pointer-events:none;touch-action:none}
.cg[hidden]{display:none}
.cg canvas{width:100%;height:100%;display:block}
.cg.mid{pointer-events:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:220px;height:220px}
.cgp-top{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 18%);text-align:center;z-index:7;font-family:var(--f-display);font-size:clamp(22px,5vw,32px);letter-spacing:.14em;color:var(--bone);pointer-events:none}
.cgp-top[hidden]{display:none}
.cgp-top small{display:block;font-family:var(--f-body);font-size:13px;letter-spacing:.06em;color:var(--bone-dim);margin-top:6px}
body.capmode .btns,body.capmode .joy{display:none!important}
.stepper{display:flex;align-items:center;gap:10px;grid-column:2/4;justify-content:flex-end}
.stepper .go{margin:0;padding:6px 14px;min-width:44px}
.stepper output{min-width:5.2em;text-align:center}
@media (pointer:coarse){.cg{left:auto;transform:none;right:calc(max(16px,env(safe-area-inset-right,0px)) + 6px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);pointer-events:auto;width:164px;height:164px}.cg.mid{left:50%;right:auto}}
.capinfo b{width:12px;height:12px;border-radius:50%;border:2px solid var(--bone-dim)}
.capinfo b.on{background:var(--stam);border-color:var(--stam)}
.mates i.lost{opacity:.3;animation:dpulse 1.2s ease-in-out infinite}
.netfx{position:fixed;left:50%;top:26%;transform:translate(-50%,-50%);z-index:9;display:grid;justify-items:center;gap:10px;padding:16px 22px;border-radius:14px;background:rgba(8,7,9,.82);border:1px solid var(--line);color:var(--bone);font-size:15px;letter-spacing:.08em}
.netfx[hidden]{display:none}
.netfx .nf-ic{display:flex;gap:7px}
.netfx .nf-ic i{width:9px;height:9px;border-radius:50%;background:var(--bone);animation:nfd 1s ease-in-out infinite}
.netfx .nf-ic i:nth-child(2){animation-delay:.18s}.netfx .nf-ic i:nth-child(3){animation-delay:.36s}
.netfx.still .nf-ic i{animation:none;opacity:.35}
@keyframes nfd{0%,100%{opacity:.2;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
.netfx .nf-p{display:flex;gap:6px}
.netfx .nf-p b{width:16px;height:4px;border-radius:2px;background:rgba(232,226,212,.25)}
.netfx .nf-p b.used{background:var(--blood)}
.netfx .go{margin:2px 0 0;padding:8px 18px;font-size:14px}
.mates i.down{background:transparent;border:2px solid var(--c);animation:dpulse .8s ease-in-out infinite}
.downfx{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at center,rgba(120,0,0,0) 20%,rgba(120,0,0,.8) 100%);animation:dpulse 1.6s ease-in-out infinite}
@keyframes dpulse{50%{opacity:.55}}
.ring{position:fixed;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:conic-gradient(var(--exit) calc(var(--p,0)*1turn),rgba(232,226,212,.15) 0);-webkit-mask:radial-gradient(circle,transparent 24px,#000 25px);mask:radial-gradient(circle,transparent 24px,#000 25px);pointer-events:none;z-index:3}
.leave{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);z-index:7;display:flex;flex-direction:column;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px}
.leave .dots{display:flex;gap:8px}
.leave .dots i{width:18px;height:18px;border-radius:50%;background:var(--c)}
.leave .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.who{display:flex;gap:12px;justify-content:center;min-height:28px;flex-wrap:wrap}
.code{display:flex;align-items:center;gap:12px;font-family:var(--f-body);font-weight:700;font-size:14px;color:var(--bone)}
.code input{width:6.2em;font:700 26px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.22em;text-align:center;text-transform:uppercase;padding:8px 4px 8px 10px;border-radius:6px;border:2px solid var(--bone);background:transparent;color:var(--bone)}
.code input:focus{outline:2px solid var(--bone);outline-offset:2px}
.pcode{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;letter-spacing:.18em;opacity:.8;margin:0}
.who i{width:58px;height:70px;border-radius:10px;background:#1d1c21 center/cover;border:3px solid var(--c)}
.who i.me{box-shadow:0 0 0 2px var(--bone)}
.chars{display:grid;grid-template-columns:repeat(6,66px);gap:8px;justify-content:center}
@media (max-width:520px){.chars{grid-template-columns:repeat(3,78px)}}
.chr{aspect-ratio:9/11;border-radius:10px;border:2px solid var(--line);background:#1d1c21 top center/100% auto no-repeat;aspect-ratio:9/15;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent;position:relative;overflow:hidden}
.chr span{position:absolute;left:0;right:0;bottom:0;background:#0c0b0e;color:var(--bone);font-size:10px;line-height:1.25;padding:2px 0 3px;white-space:nowrap}
.chr span b{display:block;font-size:13px;font-weight:400}
.chr.sel{border-color:var(--bone);box-shadow:0 0 0 2px var(--bone),0 0 18px rgba(232,226,212,.35)}
.qte{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(ellipse at center,rgba(0,0,0,.15),rgba(0,0,0,.8));pointer-events:none;padding-inline:16px}
.arrows{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.arrows span{font-size:clamp(30px,7vw,52px);font-weight:700;width:1.35em;height:1.35em;display:grid;place-items:center;border:2px solid var(--bone-dim);border-radius:8px;color:var(--bone);background:rgba(5,5,6,.6)}
.arrows span.cur{border-color:var(--blood);box-shadow:0 0 14px var(--blood)}
.arrows span.done{background:var(--bone);color:var(--void);border-color:var(--bone)}
.arrows.fail span{border-color:var(--blood);color:var(--blood)}
.qbar{width:min(360px,70vw);height:6px;background:rgba(232,226,212,.2);border-radius:3px;overflow:hidden}
.qbar i{display:block;height:100%;width:100%;background:var(--blood);transform-origin:left center}
.qpad{display:none;grid-template-columns:repeat(3,72px);gap:6px;pointer-events:auto}
.qpad .btn{width:72px;height:72px;font-size:28px}
@media (pointer:coarse){.qpad{display:grid}}
.go.sub{border-color:var(--bone-dim);color:var(--bone-dim);font-size:14px;padding:9px 24px}
.map{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:flex-end;gap:4px;z-index:2;pointer-events:none}
.map canvas{width:150px;height:150px;background:var(--panel);border:1px solid var(--line);border-radius:6px;image-rendering:pixelated}
.map span{font-family:var(--f-display);font-size:13px;letter-spacing:.08em}
.help{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12px;line-height:1.75;z-index:2;pointer-events:none;color:var(--bone-dim);transition:opacity 1.2s}
.help.fade{opacity:0}
.help b{display:inline-block;min-width:86px;color:var(--bone)}
.touch{display:none}
@media (pointer:coarse){.help{display:none}.touch{display:block}.map canvas{width:112px;height:112px}.hud .mini{display:block}}
@media (pointer:coarse) and (max-height:430px){.map canvas{width:96px;height:96px}.touch .btn.big{width:100px;height:100px}.touch .btn{width:70px;height:70px}}
.btns{position:fixed;right:calc(max(16px,env(safe-area-inset-right,0px)) + 4px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;gap:16px;align-items:flex-end;z-index:3}
.btn{width:76px;height:76px;border-radius:50%;border:2px solid var(--line);background:var(--panel);color:var(--bone);font-family:var(--f-body);font-weight:700;font-size:13px;touch-action:none;-webkit-tap-highlight-color:transparent}
.btn.big{width:112px;height:112px;font-size:17px;border-color:var(--bone-dim);position:relative;display:grid;place-items:center}
.btn .ar{position:absolute;left:50%;width:0;height:0;margin-left:-9px;border-left:9px solid transparent;border-right:9px solid transparent;opacity:.45}
.btn .ar.up{top:12px;border-bottom:11px solid currentColor}
.btn .ar.dn{bottom:12px;border-top:11px solid currentColor}
.btn.sq{border-color:var(--stam)}
.btn.sq .ar.dn{opacity:1;color:var(--stam)}
.btn.fl-up .ar.up,.btn.fl-dn .ar.dn{opacity:1}
.mini{display:none;pointer-events:auto;align-self:flex-start;margin-top:2px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--bone-dim);font-family:var(--f-body);font-weight:700;font-size:12px;touch-action:none;-webkit-tap-highlight-color:transparent}
.mini.on{background:var(--bone);color:var(--void)}
.hud .mini.spd{display:block;min-width:46px}
/* 見守る（地図だけの画面） */
.watch{position:fixed;inset:0;z-index:2;background:#070608;touch-action:none;-webkit-user-select:none;user-select:none}
.watch #wcv{position:absolute;inset:0;width:100%;height:100%;display:block}
.wbar{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;gap:12px;align-items:center;font:700 14px var(--f-body);color:var(--bone);pointer-events:none}
.wbar button{pointer-events:auto;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:rgba(8,7,9,.8);color:var(--bone);font:700 15px var(--f-body);cursor:pointer}
body.wv .wbar{left:auto;right:max(12px,env(safe-area-inset-right,0px))}
.wpz{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,4,6,.78)}
.wpz canvas{touch-action:none;cursor:pointer;display:block}
.wpz .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right,0px));width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:rgba(8,7,9,.85);color:var(--bone);font:700 18px var(--f-body);cursor:pointer}
body.wm .hud,body.wm .map,body.wm .dot,body.wm .touch,body.wm .help,body.wv .map,body.wv .dot,body.wv .touch,body.wv .help{display:none!important}
.chr.cam{background:#141318}
.chr.cam svg{position:absolute;left:50%;top:38%;width:58%;transform:translate(-50%,-50%);opacity:.9}
.chars.has-cam{grid-template-columns:repeat(7,60px)}
@media (max-width:520px){.chars.has-cam{grid-template-columns:repeat(4,70px)}}
.chr.pop{animation:campop .6s ease}
@keyframes campop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08)}100%{transform:none;opacity:1}}
.mini[hidden]{display:none!important}
.btn.on,.btn:active{background:var(--bone);color:var(--void)}
.joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid var(--line);background:rgba(8,8,10,.35);pointer-events:none;z-index:2}
.joy i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:var(--bone);opacity:.7}
.screen{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(5,5,6,.86);padding-inline:max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.screen .box{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;max-width:34rem;padding-block:16px}
.screen h1{font-family:var(--f-display);font-size:clamp(28px,7vw,44px);margin:0;letter-spacing:.06em;text-wrap:balance}
.screen h1.red{color:var(--blood)}
.screen p{margin:0;color:var(--bone-dim);line-height:1.7;font-size:14px}
.go{font-family:var(--f-body);font-weight:700;font-size:16px;padding:12px 32px;border-radius:6px;border:2px solid var(--bone);background:transparent;color:var(--bone);cursor:pointer}
.go:hover,.go:focus-visible{background:var(--bone);color:var(--void);outline:none}
.map{align-items:flex-end}
.gear{position:absolute;right:calc(100% + 8px);top:0;pointer-events:auto;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--bone);font-size:20px;line-height:1;display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent;padding:0}
.gear:active{background:var(--bone);color:var(--void)}
#s-opt{background:rgba(5,5,6,.74)}
.opt{width:min(30rem,100%);align-items:stretch!important;text-align:left!important}
.opt h1{text-align:center}
.opt h2{margin:6px 0 0;font-size:12px;letter-spacing:.14em;color:var(--bone-dim);font-weight:700}
.orow{display:grid;grid-template-columns:7.5em 1fr 3.2em;align-items:center;gap:10px;min-height:40px;border-bottom:1px solid var(--line)}
.orow span{font-size:14px;font-weight:700}
.orow output{font-size:13px;color:var(--bone-dim);text-align:right;font-variant-numeric:tabular-nums}
.orow input[type=range]{width:100%;accent-color:var(--bone);height:28px}
.krow{display:flex;justify-content:space-between;align-items:center;min-height:40px;border-bottom:1px solid var(--line);gap:10px}
.krow span{font-size:14px;font-weight:700}
.key{min-width:5.5em;padding:7px 12px;border-radius:6px;border:1px solid var(--bone-dim);background:rgba(232,226,212,.06);color:var(--bone);font-family:var(--f-body);font-weight:700;font-size:14px;cursor:pointer}
.key:hover,.key:focus-visible{border-color:var(--bone);outline:none}
.key.wait{border-color:var(--blood);color:var(--blood);animation:dpulse .8s ease-in-out infinite}
.key.fixed{border-style:dashed;cursor:default;color:var(--bone-dim)}
.tip{font-size:13px;color:var(--bone-dim);text-align:right}
.orow-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.banner{position:fixed;left:0;right:0;top:34%;text-align:center;font-family:var(--f-display);font-size:clamp(24px,6vw,38px);letter-spacing:.1em;z-index:4;pointer-events:none;opacity:0;transition:opacity .8s;padding-inline:16px}
.banner.on{opacity:1;transition:opacity .2s}
</style>
<style>html,body{margin:0;height:100%;background:#050506;overflow:hidden;overscroll-behavior:none}</style>
</head><body>


<canvas id="game" tabindex="0"></canvas>
<div class="vignette"></div>
<div class="grain" id="grain"></div>
<div class="dread" id="dread"></div>
<div class="glitch" id="glitch"></div>
<div class="downfx" id="downfx" hidden></div>
<div class="usehint" id="usehint" hidden></div>
<div class="story" id="story"></div>
<div class="capinfo" id="capinfo" hidden></div>
<div class="cg" id="cg" hidden><canvas id="cg-c" width="344" height="344"></canvas></div>
<div class="cgp-top" id="cgp-top" hidden></div>
<div class="netfx" id="netfx" hidden><div class="nf-ic"><i></i><i></i><i></i></div><div id="netfx-t"></div><div class="nf-p" id="netfx-p"></div><button class="go sub" id="go-netback" type="button" hidden>もどる</button></div>
<div class="ring" id="ring" hidden></div>
<div class="hurt" id="hurt"></div>
<div class="hpfx" id="hpfx"></div>
<div class="tirefx" id="tirefx"></div>
<div class="flashw" id="flashw"></div>
<div class="deathfx" id="deathfx"></div>
<div class="dot"></div>

<div class="watch" id="watch" hidden><canvas id="wcv"></canvas><div class="wbar"><button id="w-back" type="button" aria-label="もどる">✕</button><span id="w-fl"></span></div><div class="wpz" id="wpz" hidden><canvas id="wpc"></canvas><button class="x" id="wpz-x" type="button" aria-label="やめる">✕</button></div></div>

<div class="hud">
  <div hidden><div class="hp" id="hp"><i></i><i></i><i></i><i hidden></i></div><div class="stam" id="stam"><i id="stam-bar"></i></div><div class="batt" id="batt"><i id="batt-bar"></i></div></div>
  <div class="meta auto" id="auto" hidden>自動 <b id="auto-v"></b></div>
  <button class="mini" id="b-auto" type="button">自動</button>
  <button class="mini spd" id="b-speed" type="button" hidden>×1</button>
  <button class="mini spd" id="b-view" type="button" hidden aria-label="地図">▦</button>
  <div hidden><span id="fps"></span></div>
</div>

<div class="map"><canvas id="map" width="150" height="150"></canvas><span class="mapline"><span id="floor">地下1階</span> <span id="map-l">1F</span></span><div class="pips" id="obj"></div><div class="mates" id="mates"></div><button class="gear" id="b-opt" type="button" aria-label="設定">⚙</button></div>

<div class="help" id="help"></div>

<div class="touch">
  <div class="btns">
    <button class="btn" id="b-use" type="button" hidden></button>
    <button class="btn" id="b-light" type="button">ライト</button>
    <button class="btn big" id="b-run" type="button"><i class="ar up"></i><span id="b-run-t">走る</span><i class="ar dn"></i></button>
  </div>
  <div class="joy" id="joy" hidden><i id="knob"></i></div>
</div>

<div class="banner" id="banner"></div>
<div class="qte" id="qte" hidden>
  <div class="arrows" id="qte-a"></div>
  <div class="qbar"><i id="qte-t"></i></div>
  <div class="qpad">
    <span></span><button class="btn" type="button" data-d="0">↑</button><span></span>
    <button class="btn" type="button" data-d="3">←</button><span></span><button class="btn" type="button" data-d="1">→</button>
    <span></span><button class="btn" type="button" data-d="2">↓</button><span></span>
  </div>
</div>

<div class="screen" id="s-start">
  <div class="box">
    <h1 class="ttl">もういい<b>かい</b></h1>
    <div class="ttl-rule"></div>
    <p class="lore"><span>あの日、ふざけて地下に閉じこめた。</span><span>つぎの朝、あの子は冷たくなっていた。</span><span>だれにも言わなかった。──今夜、あの子が呼んでいる。</span></p>
    <div class="chars" id="start-chars"></div>
    <div class="go-row"><button class="go" id="go-start" type="button">ひとりで</button><button class="go" id="go-mp" type="button">みんなで</button></div>
    <div class="go-row"><button class="go sub" id="go-auto" type="button">自動で見る</button><button class="go sub" id="go-opt" type="button">設定</button></div>
  </div>
</div>
<div class="screen" id="s-lobby" hidden>
  <div class="box">
    <h1 id="lobby-h">みんなで</h1>
    <div class="who" id="lobby-who"></div>
    <div class="chars" id="lobby-chars"></div>
    <label class="code" id="lobby-code" hidden><span>合言葉</span><input id="code-in" maxlength="4" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="done"></label>
    <button class="go" id="go-join" type="button" hidden>入る</button>
    <button class="go" id="go-host" type="button">部屋を作る</button>
    <button class="go sub" id="go-back" type="button">もどる</button>
    <p id="lobby-msg"></p>
  </div>
</div>
<div class="leave" id="leave" hidden>
  <div class="dots" id="leave-dots"></div>
  <div class="row"><button class="go" id="go-leave" type="button">置いていく</button><button class="go sub" id="go-wait" type="button">待つ</button></div>
</div>
<div class="screen" id="s-pause" hidden>
  <div class="box"><h1>一時停止</h1><p class="pcode" id="pause-code" hidden></p><button class="go" id="go-resume" type="button">つづける</button><button class="go sub" id="go-opt2" type="button">設定</button><button class="go sub" id="go-title" type="button">タイトルにもどる</button></div>
</div>
<div class="screen" id="s-opt" hidden>
  <div class="box opt">
    <h1>設定</h1>
    <h2>感度</h2>
    <label class="orow" id="row-mouse"><span>マウス</span><input type="range" id="o-mouse" min="0.2" max="3" step="0.05"><output id="v-mouse"></output></label>
    <label class="orow" id="row-touch"><span>スワイプ</span><input type="range" id="o-touch" min="0.2" max="3" step="0.05"><output id="v-touch"></output></label>
    <h2>画面と音</h2>
    <label class="orow"><span>明るさ</span><input type="range" id="o-bright" min="0.6" max="1.8" step="0.05"><output id="v-bright"></output></label>
    <label class="orow"><span>BGM</span><input type="range" id="o-bgm" min="0" max="1" step="0.05"><output id="v-bgm"></output></label>
    <label class="orow"><span>効果音</span><input type="range" id="o-sfx" min="0" max="1" step="0.05"><output id="v-sfx"></output></label>
    <h2>あそび方</h2>
    <div class="orow"><span>はじめる階</span><div class="stepper"><button class="go sub" id="o-sf-dn" type="button">−</button><output id="v-sf"></output><button class="go sub" id="o-sf-up" type="button">＋</button></div></div>
    <div class="orow-btns"><button class="go sub" id="o-cgp" type="button">「もがく」だけ遊ぶ</button></div>
    <h2>操作</h2>
    <div id="o-keys"></div>
    <p id="o-keynote" hidden style="color:var(--blood);font-size:13px;margin:0">⌘ キーは使えません（押している間、ほかのキーが離れなくなります）</p>
    <div class="orow-btns"><button class="go sub" id="o-title" type="button">タイトルにもどる</button><button class="go sub" id="o-reset" type="button">初期設定に戻す</button><button class="go" id="o-close" type="button">とじる</button></div>
  </div>
</div>
<div class="clearfx" id="clearfx"></div>
<div class="screen" id="s-clear" hidden>
  <div class="box"><h1>脱出</h1><p class="lore" id="clear-story"></p><div class="stats" id="clear-stats"></div><button class="go" id="go-again" type="button">もう一度</button></div>
</div>
<div class="screen" id="s-cgp" hidden>
  <div class="box"><h1>もがく</h1><div class="stats" id="cgp-stats" style="display:grid;grid-template-columns:auto auto;gap:6px 18px;justify-content:center;font-size:17px;margin:6px 0 14px"></div><button class="go" id="go-cgagain" type="button">もう一度</button><button class="go sub" id="go-cgback" type="button">もどる</button></div>
</div>
<div class="screen" id="s-over" hidden>
  <div class="box"><h1 class="red">捕まった</h1><p id="over-text"></p><button class="go" id="go-retry" type="button">もう一度</button><button class="go sub" id="go-overtitle" type="button">タイトルにもどる</button></div>
</div>

<script>
(function(){
if(!window.THREE){document.body.insertAdjacentHTML('beforeend','<div class="screen"><p>3Dライブラリを読み込めませんでした。ページを再読み込みしてください。</p></div>');return;}
const $=id=>document.getElementById(id);
const isTouch=matchMedia('(pointer:coarse)').matches;

/* ===== 定数 ===== */
const CS=4.5;          // 1マスの広さ（m）
const H1=3.3;          // 2階の床の高さ
const SLAB=0.25;       // 2階の床の厚み
const H2=6.6;          // 2階の天井
const BEAMB=1.0;       // 低い隙間の高さ
const STEP=0.55,STAND=1.7,CROUCHH=0.9,PR=0.3,JUMPV=5.6,GRAV=16;
const HFOV=100;        // 横の視野角（度）
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];

/* ===== 描画（iPhone 17 以降・PC 向け：影・なめらかな輪郭・高精細） ===== */
const canvas=$('game');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.localClippingEnabled=true;
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const MAXANI=Math.min(8,renderer.capabilities.getMaxAnisotropy());
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x040405);
scene.fog=new THREE.Fog(0x040405,2,22);
const camera=new THREE.PerspectiveCamera(75,1,0.05,50);
camera.rotation.order='YXZ';
scene.add(camera);
const ambient=new THREE.AmbientLight(0x3a4250,0.2);scene.add(ambient);
const TORCH_I=2.6;
const torch=new THREE.SpotLight(0xffe9c4,TORCH_I,26,0.72,0.55,1.2);
torch.castShadow=true;torch.shadow.mapSize.set(1024,1024);torch.shadow.camera.near=0.25;torch.shadow.camera.far=26;torch.shadow.bias=-0.0012;
scene.add(torch);scene.add(torch.target);
const eyeLights=[0,1].map(()=>{const l=new THREE.SpotLight(0xff1a0a,0,12,0.3,0.6,1.3);scene.add(l);scene.add(l.target);return l;}); // 赤い目の光
const lampLight=new THREE.PointLight(0xdfe6ff,0,9,2);             // 一番近い天井の電灯を本物の光にする
scene.add(lampLight);
function resize(){
  const a=innerWidth/innerHeight;
  renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
  renderer.setSize(innerWidth,innerHeight,false);
  camera.aspect=a;
  const v=2*Math.atan(Math.tan(HFOV*Math.PI/360)/a)*180/Math.PI;
  camera.fov=Math.min(100,Math.max(60,v));
  camera.updateProjectionMatrix();

addEventListener('resize',resize);resize();

/* ===== テクスチャ（汚れ・水垂れ・ひび割れを描き込む） ===== */
function makeTex(base,spots,frame,kind){
  const N=256,c=document.createElement('canvas');c.width=c.height=N;const g=c.getContext('2d');
  g.fillStyle=base;g.fillRect(0,0,N,N);
  const im=g.getImageData(0,0,N,N),d=im.data;
  for(let i=0;i<d.length;i+=4){const v=(Math.random()-0.5)*30;d[i]+=v;d[i+1]+=v;d[i+2]+=v;}
  g.putImageData(im,0,0);
  for(let i=0;i<spots;i++){
    const x=Math.random()*N,y=Math.random()*N,r=8+Math.random()*46;
    const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba(0,0,0,'+(0.08+Math.random()*0.22)+')');gr.addColorStop(1,'rgba(0,0,0,0)');

    const gr=g.createLinearGradient(0,N*0.72,0,N);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.5)');g.fillStyle=gr;g.fillRect(0,N*0.72,N,N*0.28);

function updateLamps(dt,pl){
  let best=null,bd=1e9;P.inPool=false;
  for(const m of L.lamps){
    m.t-=dt;
    if(m.t<=0){
      m.t=0.04+Math.random()*0.35;
      let on=m.state==='on'?1:m.state==='flicker'?(Math.random()<0.75?1:Math.random()*0.3):0;
      if(m.state!=='dead'&&EN.some(e=>layerOf(e.y)===m.l&&Math.hypot(e.x-m.x,e.z-m.z)<7))on=Math.random()<0.55?Math.random()*0.2:on;
      m.cur=on;
    }
    if(m.blackT>0){m.blackT-=dt;m.cur=0;if(m.blackT<=0){m.t=0;if(m.state==='on'&&Math.random()<0.3)m.state='flicker';}}
    m.vis=lerp(m.vis,m.cur,Math.min(1,dt*35));
    m.panelMat.color.setScalar(0.12+0.88*m.vis);
    m.poolMat.opacity=0.3*m.vis;
    if(m.l===pl){
      const d=Math.hypot(P.x-m.x,P.z-m.z);
      if(m.vis>0.4&&d<2.6)P.inPool=true;
      if(m.vis>0.05&&d<bd){bd=d;best=m;}
    }
  }
  if(best&&bd<18){lampLight.position.set(best.x,best.cy-0.4,best.z);lampLight.intensity=1.6*best.vis;}
  else lampLight.intensity=0;
  if(hum)hum.gain.value=best?0.02*best.vis*Math.max(0,1-bd/10):0;
}

const _v=new THREE.Vector3();
function lumpy(geo,amp,seed,fs,radial3){ // 頂点を波打たせて、でこぼこにする
  const p=geo.attributes.position;
  for(let i=0;i<p.count;i++){
    _v.fromBufferAttribute(p,i);
    const x=_v.x*fs,y=_v.y*fs,z=_v.z*fs;
    const f=1+amp*(Math.sin(x*4.1+seed)*Math.cos(y*3.7+seed*1.7)+Math.sin(z*5.3+y*2.9+seed*0.6)*0.7+Math.sin((x+z)*9.1+seed*2.3)*0.3);
    if(radial3)p.setXYZ(i,_v.x*f,_v.y*f,_v.z*f);else p.setXYZ(i,_v.x*f,_v.y,_v.z*f);
  }
  geo.computeVertexNormals();return geo;
}
function M3(geo,mat,x,y,z,sx,sy,sz,par){const m=new THREE.Mesh(geo,mat);m.position.set(x||0,y||0,z||0);if(sx!=null)m.scale.set(sx,sy,sz);if(par)par.add(m);return m;}
const sph=(amp,seed,w,h)=>lumpy(new THREE.SphereGeometry(1,w||14,h||10),amp,seed,1,true);
const cyl=(r0,r1,len,amp,seed)=>lumpy(new THREE.CylinderGeometry(r0,r1,len,9,4),amp,seed,3/len,false);
function seg(par,len,r0,r1,mat,seed){M3(cyl(r0,r1,len,0.17,seed),mat,0,-len/2,0,null,null,null,par);M3(new THREE.SphereGeometry(r0*1.2,8,6),mat,0,0,0,null,null,null,par);}
// 二節の手足（付け根から下へ伸びる。.k が肘・膝）
function limb2(par,x,y,z,l1,l2,r,mat,seed){
  const p=new THREE.Group();p.position.set(x,y,z);seg(p,l1,r,r*0.75,mat,seed);
  const k=new THREE.Group();k.position.y=-l1;seg(k,l2,r*0.8,r*0.5,mat,seed+3);p.add(k);par.add(p);p.k=k;return p;
}
// 蜘蛛のように、いったん持ち上がってから床へ下りる手足
function spiderLimb(par,x,y,z,side,l1,l2,r,mat,seed){
  const p=new THREE.Group();p.position.set(x,y,z);
  const u=new THREE.Group();u.rotation.z=side*2.1;seg(u,l1,r,r*0.8,mat,seed);
  const k=new THREE.Group();k.position.y=-l1;k.rotation.z=-side*1.9;seg(k,l2,r*0.8,r*0.45,mat,seed+3);u.add(k);p.add(u);par.add(p);p.k=k;return p;
}
function claws(par,y,n,len,spread,mat){
  for(let i=0;i<n;i++){
    const c=new THREE.Group();c.position.set((i-(n-1)/2)*0.02,y,0);c.rotation.z=(i-(n-1)/2)*spread;c.rotation.x=0.3;
    const m=new THREE.Mesh(new THREE.ConeGeometry(0.012+len*0.03,len,5),mat);m.rotation.x=Math.PI;m.position.y=-len/2;c.add(m);par.add(c);
  }
}
// 楕円に沿って内向きに並ぶ歯
function teethRing(par,n,rx,ry,len,z,mat){
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2,l=len*(0.6+Math.random()*0.7);
    const t=new THREE.Mesh(new THREE.ConeGeometry(len*0.22,l,5),mat);
    t.position.set(Math.cos(a)*(rx-l/2),Math.sin(a)*(ry-l/2),z);t.rotation.z=a+Math.PI/2;par.add(t);
  }
}
function hairStrands(par,n,r,y,lmin,lmax,a0,a1,up){
  for(let i=0;i<n;i++){
    const a=a0+(a1-a0)*(i/(n-1)),l=lmin+Math.random()*(lmax-lmin);
    const h=new THREE.Mesh(new THREE.CylinderGeometry(up?0.004:0.018,up?0.018:0.004,l,4),hairMat);

  }
}

function rosterFor(fl,seed){

  const base=[[],['stalker'],['doll','doll'],['ear','ceil'],['crawl','shade','hunter'],['stalker','stalker','scream'],['ceil','doll','doll','ear'],['crawl','shade','stalker','scream']];
  if(fl>=LAST)return ['hunter','shade','crawl','stalker'];
  if(fl<=base.length)return base[Math.max(1,fl)-1];
  const r=seeded((seed^0x9e3779b9)>>>0),kinds=['stalker','doll','ear','crawl','ceil','shade','scream'];
  const a=['stalker'],n=4;
  while(a.length<n){const k=kinds[(r()*kinds.length)|0];if((k==='scream'||k==='shade')&&a.includes(k))continue;a.push(k);}
  return a;
}

    R.arms.forEach((a,i)=>a.rotation.x=0.3+Math.sin(performance.now()/60+i*1.7)*0.28);   // 指がわなわな動く
    if(R.t<=0){R.state='rush';noise(0.9,0.35,3500);tone('sawtooth',500,1400,0.7,0.07);}
    return;
  }

function makeNoise(radius,x,z,y){
  if(x===undefined){x=P.x;z=P.z;y=P.y;radius*=TR().noise||1;}
  if(NET.on&&!NET.host){NET.nz=[r2(x),r2(z),r2(y),radius,++NET.nzSeq];return;}
  let nn=nodeAt(x,z,y);if(nn<0)return;
  if(!standable(nn))nn=nn%L.WW;
  let f=null;const keep=S;
  for(const e of EN){
    if((e.kind!=='stalker'&&e.kind!=='ear'&&e.kind!=='crawl')||e.state==='chase')continue;
    const sn=nodeAt(e.x,e.z,e.y);if(sn<0)continue;
    f=f||bfsTo(nn);
    const d=f[sn],pd=d<0?999:d*CS;

    else{e.state='hunt';e.calmT=0;setTarget(pd<radius*0.5?nn:randomWalk(nn,1));}
  }

}

const lerp=(a,b,t)=>a+(b-a)*t;

let lastStatus='';
function update(dt){
  if(snapT>0){snapT-=dt;yaw=angLerp(yaw,snapYaw,Math.min(1,dt*16));}
  if(keys.ArrowLeft)yaw+=2.0*dt;
  if(keys.ArrowRight)yaw-=2.0*dt;
  if(keys.ArrowUp)pitch=Math.min(1.2,pitch+1.2*dt);
  if(keys.ArrowDown)pitch=Math.max(-1.2,pitch-1.2*dt);

  let ix=(kd('right')?1:0)-(kd('left')?1:0),iz=(kd('fwd')?1:0)-(kd('back')?1:0);
  ix+=joy.x;iz-=joy.y;
  // 自動モード：自分で動かしたら、操作を返す
  if(autoMode&&Math.abs(ix)+Math.abs(iz)>0.2)setAuto(false);
  let botCrouch=false,botRun=false;
  if(autoMode){const b=bot(dt);ix=b.ix;iz=b.iz;botCrouch=b.crouch;botRun=b.run;if(b.jump)jumpQ=true;if(EN.some(e=>e.kind==='hunter'&&e.state!=='gone'&&e.dist<28)){botCrouch=!!b.need;botRun=!botCrouch;if(B.mode==='hiding'||B.mode==='wait'||B.mode==='hide'){B.mode='';B.plan=0;}}}
  const mag=Math.min(1,Math.hypot(ix,iz));
  const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
  let dx=fx*iz+rx*ix,dz=fz*iz+rz*ix;const dl=Math.hypot(dx,dz)||1;dx/=dl;dz/=dl;

  // しゃがみ（頭上が低いと立てない）
  const wantCrouch=!!(kd('crouch')||touchCrouch||botCrouch)||!!P.down;
  if(wantCrouch)P.crouchOn=true;
  else if(P.crouchOn&&!blocked(P.x,P.z,P.y,STAND,PR-0.02))P.crouchOn=false;
  P.crouch=lerp(P.crouch,P.crouchOn?1:0,Math.min(1,dt*10));
  const h=P.crouchOn?CROUCHH:STAND;

  // 走る（息切れ・音が出る）
  const wantRun=!P.down&&!P.crouchOn&&mag>0.1&&(kd('run')||touchRun||botRun);
  const running=wantRun&&!P.tired&&P.ground;
  if(running){P.stam-=dt/4.5*(TR().stam||1);if(P.stam<=0){P.stam=0;P.tired=true;}}
  else{P.stam=Math.min(1,P.stam+dt/(P.crouchOn?2.5:3.5));if(P.tired&&P.stam>0.35)P.tired=false;}
  const spd=mag*(P.cap?0:P.down?0.8:P.crouchOn?1.7:(running?6.0:3.4)*(TR().spd||1));
  const mx=dx*spd*dt,mz=dz*spd*dt,ox=P.x,oz=P.z;
  if(!blocked(P.x+mx,P.z,P.y,h,PR))P.x+=mx;
  if(!blocked(P.x,P.z+mz,P.y,h,PR))P.z+=mz;

  // 縦方向（落下・ジャンプ・よじ登り）
  if(jumpQ&&P.ground&&!P.crouchOn&&!P.down){P.vy=JUMPV;P.ground=false;}
  jumpQ=false;
  const g=groundFull(P.x,P.z,P.y);
  if(P.ground){if(g<=P.y+STEP&&g>=P.y-0.6)P.y=g;else P.ground=false;}
  if(!P.ground){
    const prevY=P.y;
    P.vy-=GRAV*dt;P.y+=P.vy*dt;
    if(P.vy>0){const cap=capAt(P.x,P.z,prevY);if(P.y+h>cap){P.y=cap-h;P.vy=0;}}
    const g2=groundFull(P.x,P.z,P.y);
    if(P.y<=g2){
      const hard=P.vy<-9;
      P.y=g2;P.vy=0;P.ground=true;
      if(hard){sndLand(0.25);makeNoise(18);}else{sndStep(0.05);makeNoise(9);}
    }
  }

  // 物にめり込んだら押し戻す（落ちながら箱の角に入り込むと動けなくなるのを防ぐ）
  if(blocked(P.x,P.z,P.y,h,PR)){
    if(!blocked(ox,oz,P.y,h,PR)){P.x=ox;P.z=oz;}
    else{
      let done=false;
      for(let r=0.1;r<=0.7&&!done;r+=0.1)for(let a=0;a<8&&!done;a++){const nx=P.x+Math.cos(a*Math.PI/4)*r,nz=P.z+Math.sin(a*Math.PI/4)*r;if(!blocked(nx,nz,P.y,h,PR)){P.x=nx;P.z=nz;done=true;}}
    }
  }
  // 自分のいる地点（あれの追跡と、足音の聞こえ方に使う）
  const [pi,pj]=cellOf(P.x,P.z);
  const pc=idx(pi,pj),pl=layerOf(P.y);
  let pn=pc+(pl?L.WW:0);
  if(!standable(pn))pn=pc; // 2階の穴の上を落ちている途中
  playerNode=pn;
  fieldT-=dt;
  if(fieldT<=0){fieldT=0.25;lField=bfsTo(pn);}

  // 自分の足音（走ると、あれに聞こえる）
  if(followStop>0&&spd<0.3){followStop-=dt*4;if(followStop<=1){followStop=0;if(followT>0){sndThump(0.3,0,true);setTimeout(()=>sndThump(0.34,0,true),420);followT=0;}}} // 止まっても、うしろは2歩つづく
  if(P.ground&&spd>0.3){P.stepT-=dt*spd;if(P.stepT<=0){P.stepT=running?1.6:1.9;sndStep(P.crouchOn?0.012:running?0.07:0.035);if(followT>0&&!SAFE){followStop=2;setTimeout(()=>sndThump(0.22,0,true),running?150:260);}if(running)makeNoise(18);else if(!P.crouchOn)makeNoise(5);}}

  // 電灯
  updateLamps(dt,pl);

  // 隠れている？（ライトを消して、明かりの外で、机の下か隙間でしゃがむ）
  let underDesk=false;
  boxesNear(P.x,P.z,o=>{if(o.desk&&P.x>o.x0-0.1&&P.x<o.x1+0.1&&P.z>o.z0-0.1&&P.z<o.z1+0.1&&P.y<o.b&&P.y>o.b-1.2)underDesk=true;});
  P.hidden=!lightOn&&!P.inPool&&P.crouchOn&&(underDesk||(pl===0&&L.beam[pc]===1));

  // 同時スイッチに乗っているか
  P.plate=-1;
  if(L.platesOn){
    L.plateObjs.forEach((o,k)=>{
      const on=Math.hypot(P.x-o.x,P.z-o.z)<1.1&&Math.abs(P.y-o.y)<1;
      if(on)P.plate=k;
      let any=on;for(const r of NET.remotes.values())if(r.gen===NET.gen&&r.plate===k)any=true;
      o.mat.color.setHex(swOpen?0x3cff8a:0x3a8cff);o.fr.material.color.setHex(swOpen?0x3cff8a:0x3a8cff);
      o.mat.opacity=swOpen?0.5:any?0.95:0.35+Math.sin(performance.now()/300)*0.1;
    });
  }

  // 見た場所をミニマップに記録
  for(let j=pj-1;j<=pj+1;j++)for(let i=pi-1;i<=pi+1;i++)if(inb(i,j))explored[idx(i,j)+(pl?L.WW:0)]=1;

  // ヒューズ
  for(let k=0;k<fuseObjs.length;k++){
    const f=fuseObjs[k];
    if(f.got)continue;
    f.m.rotation.y+=dt*2;f.g.position.y=f.y+0.6+Math.sin(performance.now()/400+f.c)*0.05;
    if(!P.down&&Math.hypot(center(ci(f.c))-P.x,center(cj(f.c))-P.z)<1.1&&Math.abs(P.y-f.y)<1.2){
      f.got=true;scene.remove(f.g);sndFuse();if(floorNo>=3&&Math.random()<0.45)scareQ='behind';
      if(NET.on&&!NET.host){NET.pk=[k,++NET.pkSeq];continue;}
      fusesGot++;updateObj();makeNoise(22);checkExit();
    }
  }

  // 敵の動き（ひとりのとき。複数人では部屋を作った人がまとめて計算）
  if(!NET.on){if(enemiesAI(dt))return;if(faceAI(dt))return;}

  updateSnatcher(dt,pl);if(state!=='play')return;
  P.inv-=dt;
  shutTick(dt);
  if(L.relicG&&!relicGot){
    L.relicG.userData.hl.material.opacity=0.38+Math.sin(performance.now()/420)*0.16;
    if(pl===0&&Math.hypot(P.x-L.relicG.position.x,P.z-L.relicG.position.z)<1.15&&!P.down){relicGot=true;runRelics++;L.relicG.visible=false;tone('sine',784,784,1.4,0.05);tone('sine',1175,1175,1.8,0.03);showStory(RELICS[Math.max(0,Math.min(RELICS.length-1,floorNo-1))],7000);}
  }
  if(NET.on){captureTick(dt);reviveTick(dt,pl);}

  // 出口
  exitTick(pc,pl);

  // ライトの電池：点けていると減り、消すと戻る。切れるとしばらく点かない
  if(lightOn){P.batt-=dt/(BATT_ON*(TR().batt||1));if(P.batt<=0){P.batt=0;P.battDead=true;setLight(false);sndClick();setTimeout(sndClick,160);setTimeout(sndClick,330);}}

  $('batt').classList.toggle('low',P.batt<0.25&&!P.battDead);$('batt').classList.toggle('dead',P.battDead);
  {
    const low=P.tired?1:Math.max(0,(0.5-P.stam)/0.5);
    $('tirefx').style.opacity=(low*0.55).toFixed(2);
    pantT-=dt;

  }

  $('stam').classList.toggle('tired',P.tired);
}

    if(p.down||p.hidden||layerOf(p.y)!==sl||Math.abs(p.y-S.y)>2.2)continue;
    const d=Math.hypot(p.x-S.x,p.z-S.z);
    if(d<13&&(p.lit||d<4.5)&&d<bd&&los(S.x,S.z,p.x,p.z,sl)){bd=d;tgt=p;}
  }
  if(S.trav)enTrav(S,dt);
  else if(S.state==='windup'){
    if(tgt){T=tgt;S.lostT=0;}else{S.lostT+=dt;if(S.lostT>0.45){S.state='calm';S.cd=3;}}
    if(S.state==='windup'&&S.stT<=0&&T){
      S.state='scream';S.stT=1.8;
      const me=S,tn=T.node,tx=T.x,tz=T.z;let f=null;
      for(const e of EN){
        if(e===me)continue;
        if(e.kind==='doll'){if(e.state!=='chase'){e.state='chase';e.lostT=0;}}
        else if(e.kind==='ear'){e.state='hunt';e.hx=tx;e.hz=tz;e.target=tn;e.field=f||(f=bfsTo(tn));}
        else if(e.kind==='stalker'||e.kind==='crawl'){if(e.state!=='chase'){S=e;e.state='hunt';e.calmT=0;setTarget(tn);}}
        else if(e.kind==='ceil'){if(e.state==='calm')e.cd=0;}
      }
      S=me;
    }
  }else if(S.state==='scream'){
    if(S.stT<=0){S.state='retreat';S.cd=22;pField=bfsTo(T?T.node:playerNode);setTarget(farthestFromPlayer());}
  }else if(S.state==='retreat'){
    if(enMove(S,S.field,3.4,dt)){S.state='calm';setTarget(randomWalk(S.lastN,3));}
  }else{
    S.state='calm';
    if(tgt&&S.cd<=0){S.state='windup';S.stT=1.4;S.lostT=0;T=tgt;}
    else{S.restT-=dt;if(S.restT<=0&&enMove(S,S.field,1.2,dt)){S.restT=2+Math.random()*5;setTarget(randomWalk(S.lastN,4));}}
  }
  S.sees=S.state==='windup';S.frozen=false;
  S.look=(S.state==='windup'||S.state==='scream')&&T?Math.atan2(T.x-S.x,T.z-S.z):S.face;
  return false;
}

/* 暗闇の影：ライトを消している人に寄ってくる。光が当たると消える。隠れていても防げない */
function shadeAI(dt,list){
  if(S.state==='gone'){
    S.stT-=dt;S.frozen=false;if(S.stT>0)return false;
    const alive=list.filter(p=>!p.down);if(!alive.length){S.stT=3;return false;}
    const dark=alive.filter(p=>!p.light),pool=dark.length?dark:alive,tp=pool[(Math.random()*pool.length)|0];
    const f=bfsOut(L.outE,tp.node),c=[];
    for(let n=0;n<f.length;n++){
      if(f[n]<4||f[n]>8||!standable(n))continue;
      const [x,z]=nodePos(n),l=n>=L.WW?1:0;
      if(lampLit(x,z,l)||alive.some(p=>layerOf(p.y)===l&&Math.hypot(p.x-x,p.z-z)<20&&los(x,z,p.x,p.z,l)))continue;
      c.push(n);
    }
    if(!c.length){S.stT=3;return false;}
    const n=c[(Math.random()*c.length)|0];
    [S.x,S.z]=nodePos(n);S.y=n>=L.WW?H1:0;S.lastN=n;S.trav=null;S.state='calm';S.burn=0;T=tp;pField=null;S.fieldT=0;
    return false;
  }
  S.pickT-=dt;
  if(!T||S.pickT<=0){
    S.pickT=0.6;let b=null,bs=1e9;
    for(const p of list){if(p.down)continue;const s=Math.hypot(p.x-S.x,p.z-S.z)+(layerOf(p.y)!==layerOf(S.y)?10:0)+(p.light?14:0);if(s<bs){bs=s;b=p;}}
    T=b||list[0];
  }else T=list.find(p=>p.peer===T.peer)||list[0];
  S.fieldT-=dt;
  if(S.fieldT<=0||!pField){S.fieldT=0.3;pField=bfsTo(T.node);}
  const ddx=T.x-S.x,ddz=T.z-S.z,dist=Math.hypot(ddx,ddz)||0.001;
  const sl=layerOf(S.y),sameL=sl===layerOf(T.y)&&Math.abs(T.y-S.y)<2.2;
  const lit=!S.trav&&(lampLit(S.x,S.z,sl)||torchOn(S,list,15,0.6));
  S.frozen=lit;S.sees=!T.light;
  if(lit){S.burn+=dt;if(S.burn>0.4){S.state='gone';S.stT=10+Math.random()*12;return false;}}
  else S.burn=Math.max(0,S.burn-dt*0.5);
  const sp=lit?0:(T.light?0.7:Math.min(3.3,2.6+floorNo*0.08));
  if(S.trav)enTrav(S,dt);
  else if(sp>0){
    if(sameL&&dist<CS*1.2&&directOK(sl)&&los(S.x,S.z,T.x,T.z,sl))enWalk(S,T.x,T.z,sp,dt);
    else enMove(S,pField,sp,dt);
  }
  S.look=Math.atan2(ddx,ddz);
  for(const p of list){
    if(p.down)continue;
    if(Math.hypot(p.x-S.x,p.z-S.z)<0.8&&Math.abs(p.y-S.y)<1.0&&!lit&&canHit(p)){
      const over=hitPlayer(p,S);
      S.state='gone';S.stT=14;
      if(over)return true;
      break;
    }
  }
  return false;
}

/* ===== 敵の見え方と音（全員がそれぞれ計算） ===== */
function enemyFX(dt,pl){
  const e=S;e.ft=(e.ft||0)+dt;e.stungT-=dt;e.glimpseT-=dt;e.stingCd-=dt;
  const ddx=P.x-e.x,ddz=P.z-e.z,dist=Math.hypot(ddx,ddz)||0.001;
  const sl=layerOf(e.y),sameL=sl===pl&&Math.abs(P.y-e.y)<2.2;
  const sn=nodeAt(e.x,e.z,e.y);
  const pd=sn>=0&&lField?lField[sn]:-1;
  const pathD=pd<0?99:pd*CS;
  const seeLine=sameL&&los(e.x,e.z,P.x,P.z,sl);
  const front=(-ddx*-Math.sin(yaw)-ddz*-Math.cos(yaw))/dist;
  const pan=(ddx*-Math.cos(yaw)+ddz*Math.sin(yaw))/dist;
  const hear=Math.min(pathD,dist*1.6+(sameL?0:6));
  const mv=Math.hypot(e.x-e.px,e.z-e.pz)/Math.max(dt,1e-3);e.px=e.x;e.pz=e.z;
  const moving=mv>0.2||e.climbing;
  e.dist=dist;e.pathD=pathD;e.seeLine=seeLine;e.front=front;
  if(e.kind==='hunter')return hunterFX(e,dt,hear,pan,pathD,moving);
  let prox=0,chase=false;
  if(e.kind==='doll'){
    e.g.position.set(e.x,e.y,e.z);
    const awake=e.state==='chase';
    if(moving&&!e.frozen){
      e.g.rotation.y=e.look||0;e.wasMoving=true;
      e.arms[0].rotation.x=-1.3+Math.sin(e.ft*19)*0.5;e.arms[1].rotation.x=-1.3-Math.sin(e.ft*19)*0.5;
      e.legs[0].rotation.x=Math.sin(e.ft*19)*0.7;e.legs[1].rotation.x=-Math.sin(e.ft*19)*0.7;
      e.head.rotation.z=Math.sin(e.ft*23)*0.25;e.head.rotation.y=0;
      e.stepT-=dt;
      if(e.stepT<=0){e.stepT=awake?0.13:0.3;sndTick(Math.pow(Math.max(0,1-hear/26),2)*0.45,pan);}
    }else{
      if(e.wasMoving||e.pose==null){
        // 目を離すたびに、姿勢が変わっている
        e.wasMoving=false;const close=awake?Math.max(0,1-dist/7):0;
        e.pose=[-(0.1+Math.random()*0.5+close*1.2),-(0.1+Math.random()*0.5+close*1.2),(Math.random()-0.5)*(awake?1.0:0.3)];
        e.g.rotation.y=e.look||0;
        e.arms[0].rotation.x=e.pose[0];e.arms[1].rotation.x=e.pose[1];e.head.rotation.z=e.pose[2];
        e.legs[0].rotation.x=0;e.legs[1].rotation.x=0;
      }
      // 体は動かない。首だけがこちらを向く
      if(awake)e.head.rotation.y=Math.max(-1.3,Math.min(1.3,angLerp(0,Math.atan2(ddx,ddz)-e.g.rotation.y,1)));
    }
    if(e.extra&&!e.frozen)e.extra.k.rotation.x=-1.2+Math.sin(e.ft*13)*0.25;
    const visible=seeLine&&front>0.55&&(lightOn||dist<3);
    if(visible&&!e.vis&&awake&&dist<5.5&&e.stingCd<=0){sndSting();flicker=Math.max(flicker,0.3);e.stingCd=12;}
    e.vis=visible;
    if(awake&&e.fxPrev!=='chase'&&hear<30)sndBox(0.8,pan);
    e.boxT-=dt;
    if(awake&&hear<30&&e.boxT<=0){e.boxT=2.4+Math.random()*3;sndBox(Math.max(0.12,1-hear/30),pan);}
    prox=awake?Math.max(0,1-hear/24):Math.max(0,1-hear/10)*0.4;
  }else if(e.kind==='ear'){
    const hunt=e.state==='hunt';
    e.g.position.set(e.x,e.y,e.z);e.g.rotation.y=e.look||0;
    const w=moving?(hunt?12:3.2):0;
    e.legs[0].rotation.x=Math.sin(e.ft*w)*0.5;e.legs[1].rotation.x=-Math.sin(e.ft*w)*0.5;
    const spread=lerp(Math.abs(e.arms[0].rotation.z),hunt?0.55:0.05,Math.min(1,dt*4));
    e.arms[0].rotation.z=-spread;e.arms[1].rotation.z=spread;
    e.arms[0].rotation.x=Math.sin(e.ft*(hunt?12:1.3))*(hunt?0.5:0.12);e.arms[1].rotation.x=-e.arms[0].rotation.x;
    e.head.rotation.z=hunt?Math.sin(e.ft*31)*0.12:Math.sin(e.ft*0.7)*0.55;
    e.head.rotation.y=hunt?0:Math.sin(e.ft*0.43)*0.9;
    // 舌を鳴らす音。音を聞きつけると速くなる
    e.clickT-=dt;
    if(e.clickT<=0){e.clickT=hunt?0.13+Math.random()*0.08:e.state==='search'?0.4+Math.random()*0.2:0.9+Math.random()*0.6;sndClickE(Math.pow(Math.max(0,1-hear/40),1.5)*0.5,pan);}
    e.stepT-=dt;
    if(e.stepT<=0&&moving){e.stepT=hunt?0.24:0.75;sndThump(Math.pow(Math.max(0,1-hear/40),2)*(hunt?0.7:0.4),pan,!seeLine);}
    if(hunt&&e.fxPrev!=='hunt'&&hear<45){sndShriek(Math.max(0.25,1-hear/45),pan);flicker=Math.max(flicker,0.35);}
    prox=Math.max(0,1-hear/30)*(hunt?1:0.8);chase=hunt&&hear<26;
  }else if(e.kind==='crawl'){
    const fast=e.state==='chase',rec=e.frozen;
    e.g.position.set(e.x,e.y,e.z);e.g.rotation.y=e.look||0;
    const w=moving?(fast?17:7):0,am=moving?0.55:0.04;
    e.arms[0].rotation.x=Math.sin(e.ft*w)*am;e.arms[1].rotation.x=-Math.sin(e.ft*w)*am;
    e.legs[0].rotation.x=-Math.sin(e.ft*w+0.6)*am;e.legs[1].rotation.x=Math.sin(e.ft*w+0.6)*am;
    e.body.position.y=lerp(e.body.position.y,rec?-0.14:0,Math.min(1,dt*8))+Math.abs(Math.sin(e.ft*w))*0.012;
    e.body.rotation.z=moving?Math.sin(e.ft*w)*0.08:0;
    e.head.rotation.z=Math.PI+(fast?Math.sin(e.ft*27)*0.28:Math.sin(e.ft*0.8)*0.5);
    e.head.rotation.x=lerp(e.head.rotation.x,rec?1.0:fast?-0.3:0.05,Math.min(1,dt*6));
    e.stepT-=dt;
    if(e.stepT<=0&&moving){e.stepT=fast?0.11:0.34;sndWet(Math.pow(Math.max(0,1-hear/32),2)*(fast?0.55:0.35),pan);}
    e.clickT-=dt;
    if(e.clickT<=0){e.clickT=0.7+Math.random()*2.2;sndCrack(Math.pow(Math.max(0,1-hear/26),1.5)*0.4,pan);}
    if(fast&&e.fxPrev!=='chase'&&dist<26){if(e.stungT<=0){sndSting();e.stungT=8;}sndGrowl(0.9,pan);flicker=Math.max(flicker,0.5);}
    if(rec&&!e.wasRec)sndHiss(Math.max(0.2,1-dist/12),pan);
    e.wasRec=rec;
    prox=Math.max(0,1-hear/28);chase=fast&&dist<24;
  }else if(e.kind==='ceil'){
    const onCeil=e.state==='calm'||e.state==='stalk'||e.state==='windup';
    const top=(sl?H2-H1:H1-SLAB)-0.04,tgt=onCeil?top:0;
    if(e.hv==null)e.hv=tgt;
    const rate=e.state==='drop'?18:e.state==='climb'?2.6:8;
    e.hv+=Math.max(-rate*dt,Math.min(rate*dt,tgt-e.hv));
    const flip=e.hv>top*0.5;
    e.g.position.set(e.x,e.y+e.hv,e.z);e.g.rotation.y=e.look||0;
    e.g.rotation.z=lerp(e.g.rotation.z,flip?Math.PI:0,Math.min(1,dt*12));
    const w=moving?(e.state==='chase'?20:9):0;
    e.limbs.forEach((l,i)=>{l.rotation.x=Math.sin(e.ft*w+i*2.1)*(moving?0.45:0.04);});
    // 首：天井にいる間は、真下にぶら下がる
    e.neck.rotation.x=lerp(e.neck.rotation.x,flip?Math.PI+Math.sin(e.ft*1.3)*0.25:-2.0+Math.sin(e.ft*3)*0.15,Math.min(1,dt*6));
    e.head.rotation.x=lerp(e.head.rotation.x,flip?0:1.2,Math.min(1,dt*6));
    e.head.rotation.y=flip?Math.sin(e.ft*0.9)*1.2:0;
    e.jaw.rotation.x=e.state==='windup'||e.state==='drop'||e.state==='chase'?0.95:0.15+Math.sin(e.ft*2)*0.1;
    // 天井から血がしたたる（真下にいると気づける）
    e.dripT-=dt;
    if(onCeil&&e.dripT<=0&&!e.dropM.visible){e.dripT=0.9+Math.random()*1.5;e.dropM.visible=true;e.dropY=e.hv-0.5;e.dropM.position.set(e.x,e.y+e.dropY,e.z);}
    if(e.dropM.visible){
      e.dropY-=dt*7.5;e.dropM.position.y=e.y+e.dropY;
      if(e.dropY<=0){e.dropM.visible=false;const v=Math.pow(Math.max(0,1-hear/14),1.5);if(v>0.02)tone('sine',1700+Math.random()*600,800,0.07,0.07*v,pan);}
    }
    e.stepT-=dt;
    if(e.stepT<=0&&moving){e.stepT=e.state==='chase'?0.07:0.17;sndTick(Math.pow(Math.max(0,1-hear/20),2)*0.35,pan);}
    if(e.state==='windup'&&e.fxPrev!=='windup')sndHiss(Math.max(0.3,1-dist/10),pan);
    if(e.state==='drop'&&e.fxPrev!=='drop'&&dist<14){sndSting();flicker=Math.max(flicker,0.5);}
    if(e.state==='chase'&&e.fxPrev==='drop')sndWet(0.8,pan);
    prox=Math.max(0,1-hear/(onCeil?16:24))*(onCeil?0.7:1);chase=e.state==='chase'&&dist<20;
  }else if(e.kind==='scream'){
    const wu=e.state==='windup',sc=e.state==='scream';
    e.g.position.set(e.x,e.y,e.z);e.g.rotation.y=e.look||0;
    const w=moving?(e.state==='retreat'?11:4):0;
    e.legs[0].rotation.x=Math.sin(e.ft*w)*0.45;e.legs[1].rotation.x=-Math.sin(e.ft*w)*0.45;
    e.g.rotation.z=moving?Math.sin(e.ft*w)*0.06:0;
    e.arms.forEach((a,k)=>{a.rotation.x=(sc?-2.4:-0.5)+Math.sin(e.ft*(sc?40:5)+k*2)*0.15;});
    const open=sc?1.4+Math.sin(e.ft*70)*0.07:wu?1.15:0.5+Math.sin(e.ft*1.6)*0.06;
    e.maw.scale.y=lerp(e.maw.scale.y,open,Math.min(1,dt*(wu?1.6:10)));
    e.maw.scale.x=lerp(e.maw.scale.x,sc?1.25:0.9,Math.min(1,dt*10));
    e.top.rotation.x=lerp(e.top.rotation.x,sc?-0.45:wu?-0.3:Math.sin(e.ft*1.1)*0.05,Math.min(1,dt*5));
    if(wu&&e.fxPrev!=='windup'&&hear<45)sndInhale(Math.max(0.3,1-hear/45),pan);
    if(sc&&e.fxPrev!=='scream'){
      sndBigScream(Math.max(0.4,1-hear/70),pan);flicker=Math.max(flicker,1.2);pulse('flashw',120);
      for(const m of L.lamps)if(m.state!=='dead')m.blackT=1.2+Math.random()*2;
    }
    e.breathT-=dt;
    if(!sc&&!wu&&e.breathT<=0){e.breathT=2.2+Math.random()*1.4;sndBreath(Math.pow(Math.max(0,1-hear/18),1.5)*0.5,pan);}
    prox=Math.max(0,1-hear/20)*(wu||sc?1:0.6);chase=sc;
  }else if(e.kind==='shade'){
    const on=e.state!=='gone';
    e.fade=lerp(e.fade||0,on?(e.frozen?0.3:1):0,Math.min(1,dt*(on&&!e.frozen?2.5:10)));
    e.g.visible=e.fade>0.02;
    e.g.position.set(e.x,e.y+Math.sin(e.ft*1.7)*0.05,e.z);e.g.rotation.y=e.look||0;
    e.mat.opacity=0.93*e.fade;e.eyeS.forEach(sp=>sp.material.opacity=e.fade);
    const sx=1+Math.sin(e.ft*3.1)*0.06+(e.frozen?Math.random()*0.35:0);
    e.g.scale.set(sx,1+Math.sin(e.ft*2.3)*0.04,sx);
    const reach=1-Math.min(1,dist/6);
    e.arms.forEach((a,k)=>{a.rotation.x=-0.15-reach*1.3+Math.sin(e.ft*2+k*1.7)*0.1;});
    e.head.rotation.z=Math.sin(e.ft*0.6)*0.4;
    if(!on&&e.fxPrev!=='gone'&&dist<22)sndHiss(Math.max(0.2,1-dist/18),pan);
    e.breathT-=dt;
    if(on&&!lightOn&&hear<20&&e.breathT<=0){e.breathT=1.5+Math.random()*1.5;sndWhisper(pan,Math.max(0.2,1-hear/20)*1.4);}
    prox=on&&!lightOn?Math.max(0,1-hear/16):0;
  }else{
    // 状態が変わった瞬間の演出
    if(e.state==='chase'&&e.fxPrev!=='chase'&&dist<24){
      if(e.stungT<=0){sndSting();e.stungT=8;}
      sndGrowl(0.8,0);flicker=0.5;pulse('flashw',80);
    }
    if(e.state==='retreat'&&e.fxPrev==='watch'&&dist<24){sndSting();flicker=0.7;}
    const fast=e.state==='chase'||e.state==='retreat',watching=e.state==='watch';
    e.g.position.set(e.x,e.y+(fast&&!e.climbing?Math.abs(Math.sin(e.ft*9))*0.05:0),e.z);
    e.g.rotation.y=e.look||0;
    const w=fast?9:watching||!moving?0:3.5;
    if(e.climbing){e.arms[0].rotation.x=-2.6+Math.sin(e.ft*8)*0.3;e.arms[1].rotation.x=-2.6-Math.sin(e.ft*8)*0.3;}
    else if(watching){e.arms[0].rotation.x=lerp(e.arms[0].rotation.x,0,dt*3);e.arms[1].rotation.x=lerp(e.arms[1].rotation.x,0,dt*3);}
    else{e.arms[0].rotation.x=(fast?-1.3:-0.15)+Math.sin(e.ft*(fast?14:2))*0.12;e.arms[1].rotation.x=(fast?-1.3:-0.15)+Math.cos(e.ft*(fast?13:2))*0.12;}
    e.legs[0].rotation.x=Math.sin(e.ft*w)*0.6;e.legs[1].rotation.x=-Math.sin(e.ft*w)*0.6;
    e.head.rotation.z=fast?Math.sin(e.ft*23)*0.12:watching?lerp(e.head.rotation.z,0.55,dt*0.8):Math.sin(e.ft*0.9)*0.35;
    e.eyeI=(e.state==='chase'?3.2:watching?2.6:1.5)*(0.85+Math.random()*0.15);
    e.coneMat.opacity=0.035*e.eyeI;
    e.jaw.rotation.x=lerp(e.jaw.rotation.x,e.state==='chase'?0.95:watching?0.55:0.22+Math.sin(e.ft*1.3)*0.06,Math.min(1,dt*8));
    const hb=1+Math.max(0,Math.sin(e.ft*(fast?11:5)))*0.22;e.heart.scale.set(0.12*hb,0.15*hb,0.1*hb);
    const gs=0.09+e.eyeI*0.022;e.eyeGlow.forEach(sp=>sp.scale.set(gs,gs,1));
    // 足音
    e.stepT-=dt;
    if(e.stepT<=0&&moving){
      e.stepT=e.climbing?0.5:fast?0.3:e.state==='hunt'?0.45:0.7;
      sndThump(Math.pow(Math.max(0,1-hear/45),2)*(fast?0.75:0.5),pan,!seeLine);
    }

const P2P={code:'',me:'u'+Math.random().toString(36).slice(2,9),

    }

P2P.room=function(){

P2P.makeHub=function(peer){
  const R=P2P.room(),conns=new Map();

  const bcast=(m,skip)=>{for(const [c,st] of conns)if(c!==skip&&st.id)send(c,m);};
  const drop=(c,why)=>{const st=conns.get(c);if(!st)return;if(window.P2P_CFG&&window.P2P_CFG.log)console.log('p2p hub drop',st.id,why);conns.delete(c);try{c.close();}catch(e){}
    if(st.id&&![...conns.values()].some(o=>o.id===st.id)){R.others.delete(st.id);bcast({t:'x',id:st.id});}};

P2P.makeClient=function(peer,c){

/* 連れ去り：倒れたまま助けが来ないと、奥へ引きずられる。助け起こされるまで動けない */
const CAP_AFTER=16;
function captureTick(dt){
  if(!NET.on||!P.down||SAFE||PN()<2){P.downT=0;return;}
  if(P.cap){
    if(P.capT>0){
      P.capT-=dt;
      if(P.capT<=0){
        // 立っている仲間から、いちばん遠い場所へ
        const fs=[];for(const r of NET.remotes.values())if(r.gen===NET.gen&&r.st==='play'&&!r.down&&r.node>=0)fs.push(bfsOut(L.outP,r.node));
        if(!fs.length)fs.push(bfsOut(L.outP,playerNode));
        let bn=-1,bv=-1;const W=L.W,ec=L.exitN%L.WW;
        for(let j=1;j<W;j+=2)for(let i=1;i<W;i+=2){
          const n=idx(i,j);if(L.wall1[n]||L.beam[n]||L.boxes[n]||L.climb[n]>=0||n===ec)continue;
          let v=1e9;for(const f of fs)v=Math.min(v,f[n]<0?999:f[n]);
          if(v<900&&v>bv){bv=v;bn=n;}
        }
        if(bn>=0){P.x=center(ci(bn));P.z=center(cj(bn));P.y=0;P.vy=0;P.ground=true;}
        sndThump(0.7,0);lightEnv();cgBegin(false);cgInfo();
      }
    }
    cgTick(dt);
    return;
  }
  P.downT+=dt;
  if(P.downT>CAP_AFTER-4&&((P.downT*2)|0)!==(((P.downT-dt)*2)|0))sndThump(0.25+(P.downT-CAP_AFTER+4)*0.1,0,true); // 近づいてくる
  if(P.downT>=CAP_AFTER){
    P.cap=true;P.capT=1.4;$('downfx').classList.add('cap');
    sndScream();noise(1.4,0.35,140);pulse('hurt',900);
  }
}
/* 倒れた仲間を助け起こす（近くにいると輪がたまる） */
function reviveTick(dt,pl){
  if(P.down){
    for(const r of NET.remotes.values()){
      if(Array.isArray(r.rv)&&r.rv[0]===NET.me&&NET.procd['rv'+r.peer]!==r.rv[1]){NET.procd['rv'+r.peer]=r.rv[1];getUp();}
    }
  }
  let tgt=null;
  if(!P.down)for(const r of NET.remotes.values()){
    if(r.down&&!r.dead&&r.gen===NET.gen&&layerOf(r.y)===pl&&Math.hypot(r.x-P.x,r.z-P.z)<1.6){tgt=r;break;}
  }
  const ring=$('ring');
  if(tgt){
    NET.revT+=dt;ring.hidden=false;ring.style.setProperty('--p',Math.min(1,NET.revT/2.5).toFixed(3));
    if(NET.revT>=2.5){NET.rv=[tgt.peer,++NET.rvSeq];NET.revT=0;sndClick();}
  }else{NET.revT=0;ring.hidden=true;}
}

function exitTick(pc,pl){

  const dr=L.door||{x:center(ci(ec)),z:center(cj(ec)),nx:0,nz:0};
  $('obj').textContent='非常口 '+Math.round(Math.hypot(dr.x-P.x,dr.z-P.z))+'m';

  // 扉の目の前まで来て、はじめて抜けられる
  const fwd=(dr.x-P.x)*dr.nx+(dr.z-P.z)*dr.nz,side=Math.abs((dr.x-P.x)*dr.nz-(dr.z-P.z)*dr.nx);
  const at=pc===ec&&pl===0&&P.ground&&(autoMode||(fwd<0.85&&side<0.75));
  P.atExit=at;
  if(!NET.on){if(at){if(SAFE){SAFE=false;floorNo++;buildLevel();sndDescend();}else if(floorNo>=LAST){gameClear();}else{SAFE=true;if(P.hp<maxHp()){P.hp++;drawHp();}buildLevel();sndRelief();}}return;}
  if(at){
    const missing=[];for(const r of NET.remotes.values())if(r.gen===NET.gen&&r.st==='play'&&!r.ex&&!r.dead)missing.push(r);

}

const M={st:'off',t:30,x:0,z:0,y:0,face:0,fxSt:'off',av:null,tgt:'',life:0,field:null,planT:0,stepT:0};
function mimicAI(dt,list){
  if(!NET.on||list.length<2||SAFE){M.st='off';return;}
  const alive=list.filter(p=>!p.down);
  if(M.st==='off'){
    M.t-=dt;if(M.t>0||!alive.length)return;
    const tp=alive[(Math.random()*alive.length)|0];
    const f=bfsOut(L.outE,tp.node),c=[];
    for(let n=0;n<f.length;n++){
      if(f[n]<4||f[n]>8||!standable(n))continue;
      const [x,z]=nodePos(n),l=n>=L.WW?1:0;
      if(alive.some(p=>layerOf(p.y)===l&&Math.hypot(p.x-x,p.z-z)<22&&los(x,z,p.x,p.z,l)))continue;
      c.push(n);
    }
    if(!c.length){M.t=5;return;}
    const n=c[(Math.random()*c.length)|0];
    [M.x,M.z]=nodePos(n);M.y=n>=L.WW?H1:0;M.st='walk';M.life=40;M.tgt=tp.peer;M.field=null;M.planT=0;
    return;
  }
  const tp=list.find(p=>p.peer===M.tgt)||alive[0]||list[0];
  const ml=layerOf(M.y);
  if(M.st==='walk'){
    M.life-=dt;M.planT-=dt;
    if(M.planT<=0||!M.field){M.planT=0.6;const tn=layerOf(tp.y)===ml?tp.node:randomWalk(nodeAt(M.x,M.z,M.y),3);M.field=bfsLayer(tn,L.inE);}
    const cur=nodeAt(M.x,M.z,M.y);
    if(cur>=0&&M.field[cur]>0){
      let best=M.field[cur],nx=-1;
      for(const m of L.outE[cur]){if(!sameLayerNode(m,cur))continue;const v=M.field[m];if(v>=0&&v<best){best=v;nx=m;}}
      if(nx>=0){const [tx,tz]=nodePos(nx),dx=tx-M.x,dz=tz-M.z,d=Math.hypot(dx,dz);if(d>0.03){const st=Math.min(2.8*dt,d);M.x+=dx/d*st;M.z+=dz/d*st;M.face=angLerp(M.face,Math.atan2(dx,dz),Math.min(1,dt*6));}}
    }
    for(const p of alive){
      if(layerOf(p.y)===ml&&Math.hypot(p.x-M.x,p.z-M.z)<5&&los(M.x,M.z,p.x,p.z,ml)){M.st='reveal';M.t=0.9;M.tgt=p.peer;break;}
    }
    if(M.life<=0){M.st='off';M.t=25+Math.random()*20;}
  }else if(M.st==='reveal'){
    M.t-=dt;M.face=Math.atan2(tp.x-M.x,tp.z-M.z);
    if(M.t<=0){M.st='lunge';M.t=2.4;}
  }else if(M.st==='lunge'){
    M.t-=dt;
    const dx=tp.x-M.x,dz=tp.z-M.z,d=Math.hypot(dx,dz)||1;M.face=Math.atan2(dx,dz);
    const nx=M.x+dx/d*7*dt,nz=M.z+dz/d*7*dt,[i,j]=cellOf(nx,nz);
    if(airAt(i,j,ml)){M.x=nx;M.z=nz;}
    if(d<0.85&&Math.abs(tp.y-M.y)<1&&canHit(tp)){hitPlayer(tp);M.st='off';M.t=30+Math.random()*20;}
    else if(M.t<=0){M.st='off';M.t=25+Math.random()*20;}
  }
}

const goreRed=new THREE.MeshPhongMaterial({color:0x5c0707,shininess:90,specular:0x883838});

function addBackGore(a){
  const G=new THREE.Group();G.userData.goreRoot=1;(a.rt||a.g).add(G);
  const mk=(geo,m,x,y,z,sx,sy,sz,par)=>{const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);if(sx!=null)o.scale.set(sx,sy,sz);o.userData.gore=1;(par||G).add(o);return o;};

  mk(sp,goreRed,0,0.42,-0.27,0.13,0.14,0.035);      // リュックにも飛び散る
  mk(sp,goreFlesh,0.01,0.4,-0.28,0.075,0.095,0.045);// 裂け目からのぞく肉
  mk(sp,goreRed,-0.1,0.27,-0.15,0.08,0.09,0.04);
  mk(sp,goreRed,0,0.72,-0.37,0.13,0.1,0.03);        // 後ろ頭にも
  for(const [x,l] of [[-0.09,0.2],[0.03,0.3],[0.1,0.17],[-0.03,0.13]]){
    mk(new THREE.CylinderGeometry(0.012,0.008,l,6),goreRed,x,0.3-l/2,-0.22,null,null,null);
  }
  mk(sp,goreRed,0,0.015,-0.02,0.16,0.012,0.16);
  a.tent=[];
  const SEG=6;
  for(let i=0;i<6;i++){
    const outer=new THREE.Group();outer.position.set((i%3-1)*0.07,0.3+Math.floor(i/3)*0.18,-0.27);outer.rotation.y=((i%3)-1)*0.6;G.add(outer);
    const root=new THREE.Group();root.rotation.x=-Math.PI/2+0.35-Math.floor(i/3)*0.5;outer.add(root);
    const segs=[];let par=root;
    for(let k=0;k<SEG;k++){
      const L=0.1,r0=0.034*(1-k/SEG)+0.008,r1=0.034*(1-(k+1)/SEG)+0.006;
      const sg=new THREE.Group();sg.position.y=k?0.1:0;par.add(sg);
      mk(new THREE.CylinderGeometry(r1,r0,L,7),k%2?goreRed:goreFlesh,0,L/2,0,null,null,null,sg);
      if(k<4)mk(new THREE.SphereGeometry(0.013,6,5),boneMat,0.0,L/2,r0*0.95,null,null,null,sg);
      segs.push(sg);par=sg;
    }
    a.tent.push({root,segs,ph:i*1.3,sp:2.2+i*0.25});
  }
  a.gore=G;
}
function animGore(a,wild,time){

const camFwd=new THREE.Vector3();let camDt=0;
function specTarget(){
  if(!NET.on||!P.dead)return null;
  const ok=r=>r&&r.gen===NET.gen&&r.st==='play'&&!r.down&&!r.dead;
  let cur=NET.spec?NET.remotes.get(NET.spec):null;

let specOn=false,specYaw=0;

  const held=NET.on&&NET.inGame&&NET.link!=='ok';
  if(state==='play'&&held){mapT-=dt;if(mapT<=0){mapT=0.1;drawMap();}}
  else if(state==='play'){const n=autoMode&&!NET.on?autoSpeed:1;for(let i=0;i<n&&state==='play';i++)update(dt);mapT-=dt;if(mapT<=0){mapT=0.1;drawMap();}}
  else if(state==='qte')updateQTE(dt);
  else if(state==='cgp')cgTick(dt);
  else if(state==='dying')dyingTick(dt*(autoMode?autoSpeed:1));
  else if(state==='watch')watchTick(dt);
  if(NET.on){
    netTick(dt);
    if(NET.inGame&&NET.host&&!held&&state!=='lobby')hostTick(dt);
    if(NET.inGame&&!NET.watch)remoteAvatars(dt);
  }
  else if(state==='title')yaw+=dt*0.12;
  // 見守る・自動の地図：3Dは描かない（軽くする）
  if(state==='watch'){}
  else if(wView&&state==='play'){WV.t-=dt;if(WV.t<=0){WV.t=1/15;drawWatch();}}
  else{updateCamera();renderer.render(scene,camera);}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
